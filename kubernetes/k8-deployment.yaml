apiVersion: apps/v1
kind: Deployment
metadata:
  name: reciter-pm-dev
  namespace: reciter
  labels:
    app: reciter-pm-dev
    environment: dev
    owner: szd2013
    tier: frontend
spec:
  selector:
    matchLabels:
      app: reciter-pm-dev
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  replicas: 1
  template:
    metadata:
      labels:
        app: reciter-pm-dev
        environment: dev
        tier: frontend
        owner: szd2013
    spec:
      # IRSA: grants read-only DynamoDB access to ArticleProvenance (PM #737).
      # The reciter-pm service account is bound to an IAM role via eksctl; the
      # buildspec's `kubectl apply` must keep this or the provenance read loses creds.
      serviceAccountName: reciter-pm
      containers:
        # ponytail: the pipeline owns the real tag via `kubectl set image`; ":dev" is a
        # placeholder so a deliberate `kubectl apply` doesn't clobber the running image.
        - image: 665083158573.dkr.ecr.us-east-1.amazonaws.com/wcmc/reciter/reciter-publication-manager:dev
          name: reciter-pm
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXTAUTH_URL_INTERNAL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXTAUTH_URL_INTERNAL
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXTAUTH_SECRET
            - name: RECITER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_NAME
            - name: RECITER_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_USERNAME
            - name: RECITER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_PASSWORD
            - name: RECITER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_HOST
            - name: RECITER_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_API_BASE_URL
            - name: NEXT_PUBLIC_LOGIN_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXT_PUBLIC_LOGIN_PROVIDER
            - name: ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ENTITY_ID
            - name: ASSERT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ASSERT_ENDPOINT
            - name: SSO_LOGIN_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SSO_LOGIN_URL
            - name: SSO_LOGOUT_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SSO_LOGOUT_URL
            - name: SMTP_HOST_NAME
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_HOST_NAME
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_ADMIN_EMAIL
            - name: ASMS_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ASMS_API_BASE_URL
            - name: ASMS_USER_TRACKING_API_AUTHORIZATON
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ASMS_USER_TRACKING_API_AUTHORIZATON
            - name: ACS_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ACS_URL
            - name: NEXT_PUBLIC_RECITER_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXT_PUBLIC_RECITER_BACKEND_API_KEY
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1792"
            - name: RECITER_PUBMED_API_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_PUBMED_API_URL
                  optional: true
            - name: RECITER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_API_KEY
            - name: RECITER_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_TOKEN_SECRET
            # ponytail: plain value (set imperatively on the live deployment); points PM's
            # Scopus lookups at the Scopus Retrieval Tool. Prod value is http://reciter-scopus-prod.
            - name: RECITER_SCOPUS_API_URL
              value: http://reciter-scopus-dev
            # Directory lookup behind the /authorships typed-cwid box (src/lib/directory.ts).
            # Every one is `optional: true` on purpose: with a source's three vars unset that
            # source is simply absent and the assign path falls back to exactly today's
            # behaviour, so this can deploy before the secrets are populated.
            #
            # NEVER name any of these NEXT_PUBLIC_* — that prefix ships the value to the browser
            # (config/local.js:168 does it deliberately for the backend api key), and these are
            # LDAP bind credentials.
            #
            # WCM ED: ldaps://ed.weill.cornell.edu:636, bind
            # cn=reciter,ou=binds,dc=weill,dc=cornell,dc=edu — the same service account
            # reciter-inst-client binds with nightly (password in
            # reciter-inst-secrets/LDAP_BIND_PASSWORD), so egress from this cluster is proven.
            - name: WCM_ED_LDAP_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: WCM_ED_LDAP_URL
                  optional: true
            - name: WCM_ED_LDAP_BIND_DN
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: WCM_ED_LDAP_BIND_DN
                  optional: true
            - name: WCM_ED_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: WCM_ED_LDAP_BIND_PASSWORD
                  optional: true
            # Cornell Ithaca: ldaps://query.directory.cornell.edu:636, base
            # ou=People,o=Cornell University,c=us. Credentials already exist in Secrets Manager
            # as scholars/<env>/directory/cornell-ithaca-ldap, and the bind is proven from an
            # AWS egress IP — Scholars has had it live in prod since 2026-08-27.
            - name: CORNELL_LDAP_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: CORNELL_LDAP_URL
                  optional: true
            - name: CORNELL_LDAP_BIND_DN
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: CORNELL_LDAP_BIND_DN
                  optional: true
            - name: CORNELL_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: CORNELL_LDAP_BIND_PASSWORD
                  optional: true
          ports:
            - containerPort: 3000
              name: reciter-pm
          resources:
            requests:
              memory: 1500Mi
              cpu: 300m
            limits:
              memory: 2Gi
              cpu: 800m
          livenessProbe:
            httpGet:
              path: "/api/healthcheck"
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: "/api/healthcheck"
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-reciter-pm-dev
  namespace: reciter
  labels:
    app: reciter-pm-dev
    environment: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reciter-pm-dev
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
