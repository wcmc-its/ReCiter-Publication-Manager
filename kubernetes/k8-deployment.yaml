# Non-secret configuration for the reciter-pm-dev Deployment below. Prod's equivalent config
# exists ONLY in the cluster and is not in this repo, so changing a value here changes DEV ONLY.
#
# This document MUST stay AHEAD of the Deployment. The dev buildspec `kubectl apply`s this whole
# file, kubectl applies documents in file order, and a configMapKeyRef to a ConfigMap that does
# not exist yet is CreateContainerConfigError — the pod never starts, and that takes down ALL of
# reciter-pm-dev. Moving this document below the Deployment reintroduces exactly that race.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reciter-pm-dev-config
  namespace: reciter
  labels:
    app: reciter-pm-dev
    environment: dev
    owner: szd2013
    tier: frontend
data:
  # ponytail: was a plain value on the Deployment (set imperatively on the live deployment);
  # points PM's Scopus lookups at the Scopus Retrieval Tool. Prod value is http://reciter-scopus-prod.
  RECITER_SCOPUS_API_URL: http://reciter-scopus-dev
  # --- Literature Search (PR #824) ---------------------------------------------------------
  # The model id is NOT a secret: it is already on every log line this feature emits
  # (see the logCost() line in src/pages/api/literature/search.ts). Keeping it a plain
  # value makes it reviewable in the PR, and means a model change is a code change —
  # which is right, because the model determines the billing rate.
  # Without this, /api/literature/search returns a clean 503 and nothing else breaks.
  BEDROCK_MODEL_ID: us.anthropic.claude-opus-4-8
  # Belt-and-braces, NOT a blocker: the client already falls back to us-east-1
  # (controllers/literatureSearch.controller.ts). Explicit because a `us.` cross-region
  # inference profile bills the Regional CRIS tier, and that is region-dependent.
  AWS_REGION: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reciter-pm-dev
  namespace: reciter
  labels:
    app: reciter-pm-dev
    environment: dev
    owner: szd2013
    tier: frontend
spec:
  selector:
    matchLabels:
      app: reciter-pm-dev
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  replicas: 1
  template:
    metadata:
      labels:
        app: reciter-pm-dev
        environment: dev
        tier: frontend
        owner: szd2013
    spec:
      # IRSA: grants read-only DynamoDB access to ArticleProvenance (PM #737).
      # The reciter-pm service account is bound to an IAM role via eksctl; the
      # buildspec's `kubectl apply` must keep this or the provenance read loses creds.
      serviceAccountName: reciter-pm
      containers:
        # ponytail: the pipeline owns the real tag via `kubectl set image`; ":dev" is a
        # placeholder so a deliberate `kubectl apply` doesn't clobber the running image.
        - image: 665083158573.dkr.ecr.us-east-1.amazonaws.com/wcmc/reciter/reciter-publication-manager:dev
          name: reciter-pm
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXTAUTH_URL_INTERNAL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXTAUTH_URL_INTERNAL
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXTAUTH_SECRET
            - name: RECITER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_NAME
            - name: RECITER_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_USERNAME
            - name: RECITER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_PASSWORD
            - name: RECITER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_DB_HOST
            - name: RECITER_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_API_BASE_URL
            - name: NEXT_PUBLIC_LOGIN_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXT_PUBLIC_LOGIN_PROVIDER
            - name: ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ENTITY_ID
            - name: ASSERT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ASSERT_ENDPOINT
            - name: SSO_LOGIN_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SSO_LOGIN_URL
            - name: SSO_LOGOUT_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SSO_LOGOUT_URL
            - name: SMTP_HOST_NAME
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_HOST_NAME
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: SMTP_ADMIN_EMAIL
            - name: ASMS_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ASMS_API_BASE_URL
            - name: ASMS_USER_TRACKING_API_AUTHORIZATON
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ASMS_USER_TRACKING_API_AUTHORIZATON
            - name: ACS_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: ACS_URL
            - name: NEXT_PUBLIC_RECITER_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: NEXT_PUBLIC_RECITER_BACKEND_API_KEY
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1792"
            - name: RECITER_PUBMED_API_URL
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_PUBMED_API_URL
                  optional: true
            - name: RECITER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_API_KEY
            - name: RECITER_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: RECITER_TOKEN_SECRET
            # The three non-secret settings below live in the reciter-pm-dev-config ConfigMap at
            # the top of this file — read the comments there for why each is set the way it is.
            - name: RECITER_SCOPUS_API_URL
              valueFrom:
                configMapKeyRef:
                  name: reciter-pm-dev-config
                  key: RECITER_SCOPUS_API_URL
            # --- Literature Search (PR #824) -------------------------------------------------
            - name: BEDROCK_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: reciter-pm-dev-config
                  key: BEDROCK_MODEL_ID
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: reciter-pm-dev-config
                  key: AWS_REGION
            # The pilot roster. `optional: true` is LOAD-BEARING, twice over:
            #   1. This repo is PUBLIC, so the roster must not be committed. It lives only in the
            #      reciter-pm-dev-secrets Secret, and can be changed without a code deploy.
            #   2. The dev buildspec `kubectl apply`s this manifest. A secretKeyRef to a key that
            #      does not exist yet is CreateContainerConfigError — the pod never starts, and
            #      that takes down ALL of reciter-pm-dev, not just Literature Search.
            # When the key is absent the allowlist is empty, and an empty allowlist FAILS SHUT:
            # isAllowlisted() returns false for everyone, so the route 403s. Safe, not open.
            - name: LITERATURE_SEARCH_CWIDS
              valueFrom:
                secretKeyRef:
                  name: reciter-pm-dev-secrets
                  key: LITERATURE_SEARCH_CWIDS
                  optional: true
          ports:
            - containerPort: 3000
              name: reciter-pm
          resources:
            requests:
              memory: 1500Mi
              cpu: 300m
            limits:
              memory: 2Gi
              cpu: 800m
          livenessProbe:
            httpGet:
              path: "/api/healthcheck"
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: "/api/healthcheck"
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-reciter-pm-dev
  namespace: reciter
  labels:
    app: reciter-pm-dev
    environment: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reciter-pm-dev
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
