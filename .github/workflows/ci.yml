name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # what the app actually ships on: every stage of the Dockerfile is node:22-alpine.

      # Same install as the Dockerfile's deps stage: the committed lockfile is out of sync with
      # package.json, and next-auth's optional nodemailer peer needs --legacy-peer-deps.
      - run: rm -f package-lock.json && npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - run: npx tsc --noEmit

      # `npm run build` would re-run that same preinstall dance before next build. node_modules is
      # already installed by then, so all it can do is mutate the lockfile and cost a registry round
      # trip. Call the build directly.
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - run: npm test
