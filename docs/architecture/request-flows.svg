<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" width="1360" height="760" role="img" aria-labelledby="t-request-flows d-request-flows" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-request-flows">Three core journeys</title><desc id="d-request-flows">① Sign-in: the IdP posts a SAML response to saml-acs, which auto-submits to the next-auth callback; saml2-js verifies it, the user is matched in admin_users, and a JWT session is issued. ② Curate: the curate page calls the ReCiter feature-generator (by/uid, score≥30), pending feedback is merged, and publications land in Suggested / Accepted / Rejected; accept/reject writes back to ReCiter goldstandard. ③ Report: reports read the nightly analysis_* tables via Sequelize and render CSV / RTF / bibliometric files.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="24" y="70" width="1312" height="190" rx="14" fill="#e7ecff" fill-opacity="0.16" stroke="#4263eb" stroke-width="1.4"><title>① Sign-in (SAML SSO)</title></rect><rect x="24" y="300" width="1312" height="190" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>② Curate publications</title></rect><rect x="24" y="530" width="1312" height="190" rx="14" fill="#fff4d6" fill-opacity="0.16" stroke="#f08c00" stroke-width="1.4"><title>③ Report &amp; export</title></rect><path d="M194,154 L240,154" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M410,154 L456,154" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M636,154 L682,154" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M887,154 L933,154" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M1128,154 L1174,154" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M194,388 L240,388" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M420,388 L466,388" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M656,388 L702,388" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M892,388 L938,388" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M1108,388 L1154,388" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M119,428 L119,472 L797,472 L797,428" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mMaroon)"/><path d="M194,618 L240,618" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M420,618 L466,618" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M656,618 L702,618" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M872,618 L918,618" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M1108,618 L1154,618" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><rect x="175.9" y="144.5" width="82.19999999999999" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="217" y="157.4" font-size="10" fill="#3a434f" text-anchor="middle">302 redirect</text><rect x="377.275" y="144.5" width="111.44999999999999" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="433" y="157.4" font-size="10" fill="#3a434f" text-anchor="middle">SAMLResponse POST</text><rect x="620.825" y="144.5" width="76.35" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="659" y="157.4" font-size="10" fill="#3a434f" text-anchor="middle">auto-submit</text><rect x="868.