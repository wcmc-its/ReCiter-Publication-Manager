<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 620" width="1344" height="620" role="img" aria-labelledby="t-system-context d-system-context" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-system-context">System context — what feeds it, who it serves</title><desc id="d-system-context">People sign in through a SAML identity provider and use Publication Manager to curate publications and build reports. The app proxies the ReCiter engine and PubMed Retrieval Tool for disambiguation/search, reads and writes the ReCiterDB MySQL store via Sequelize, and reaches out to SMTP, a headshot API, and usage tracking.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX