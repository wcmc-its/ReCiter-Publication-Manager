675" y="454.3" width="64.65" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="1145" y="467.2" font-size="10" fill="#3a434f" text-anchor="middle">Sequelize</text><rect x="1127.3" y="526" width="35.4" height="18" rx="9" fill="#ffffff" stroke="#0ca678" stroke-opacity="0.45"/><text x="1145" y="538.9" font-size="10" fill="#3a434f" text-anchor="middle">REST</text><g><rect x="40" y="57" width="189.6" height="26" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.2"/><text x="134.8" y="74.5" font-size="12" font-weight="700" fill="#4a2fb0" text-anchor="middle">CI/CD pipeline (us-east-1)</text></g><g><rect x="256" y="317" width="222.6" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="367.3" y="334.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">Amazon EKS · namespace: reciter</text></g><g><title>GitHub repo — wcmc-its/…-Manager</title><rect x="40" y="96" width="185" height="78" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="111" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="120" font-size="13.5" font-weight="700" fill="#343a40">GitHub repo</text><text x="54" y="137" font-size="11" fill="#5b6470">wcmc-its/…-Manager</text><rect x="177.4" y="106" width="37.6" height="17" rx="8.5" fill="#f1f3f5"/><text x="196.2" y="118" font-size="10" font-weight="700" fill="#5b6470" text-anchor="middle">push</text></g><g><title>AWS CodePipeline — Source · ManualApproval; · Build</title><rect x="270" y="96" width="215" height="78" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="282" y="111" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="298" y="120" font-size="13.5" font-weight="700" fill="#4a2fb0">AWS CodePipeline</text><text x="284" y="137" font-size="11" fill="#5b6470">Source · ManualApproval</text><text x="284" y="152" font-size="11" fill="#5b6470">· Build</text></g><g><title>CodeBuild — Docke