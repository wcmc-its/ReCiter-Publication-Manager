<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 740" width="1380" height="740" role="img" aria-labelledby="t-deployment d-deployment" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-deployment">From git push to running pods on EKS</title><desc id="d-deployment">A push to a master or *dev branch drives CodePipeline (Source → ManualApproval → Build). CodeBuild pulls SAML certs from S3 and Docker creds from Secrets Manager, builds the multi-stage node:22-alpine image, pushes it to ECR, then kubectl set image rolls it onto the reciter-pm-prod / reciter-pm-dev Deployment. Traffic enters via an ALB Ingress → Service → Pod (:3000); the pod reads ReCiterDB and calls the ReCiter / PubMed APIs.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="24" y="70" width="960" height="220" rx="14" fill="#f0ebff" fill-opacity="0.16" stroke="#7048e8" stroke-width="1.4"><title>CI/CD pipeline (us-east-1)</title></rect><rect x="240" y="330" width="900" height="360" rx="14" fill="#e7ecff" fill-opacity="0.16" stroke="#4263eb" stroke-width="1.4"><title>Amazon EKS · namespace: reciter</title></rect><path d="M225,135 L270,135" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M485,135 L535,142" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGray)"/><path d="M745,142 L795,135" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M120,212 L120,202 L512,202 L535,178.8" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mGray)"/><path d="M389,212 L389,188 L512,188 L535,151.2" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mGray)"/><path d="M661,188 C661,268.73192429268613 720,337.26807570731387 720,418" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M882.5,174 C882.5,268.4026699834279 990,335.5973300165721 990,430