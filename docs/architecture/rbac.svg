<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 600" width="1340" height="600" role="img" aria-labelledby="t-rbac d-rbac" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-rbac">Roles → permissions → gated routes</title><desc id="d-rbac">At sign-in, a user's roles (and curation scope) are read from admin_users_roles, turned into capabilities by getCapabilities() / the data-driven permission tables, and embedded in the next-auth JWT. On every gated navigation, middleware.ts decodes that token and checks the route's required permission via ROUTE_PERMISSIONS, redirecting to the user's landing page when it's missing. /authorships is the exception — gated directly by role (Superuser or Curator_All), not by a permission flag.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="34" y="80" width="1272" height="190" rx="14" fill="#f0ebff" fill-opacity="0.16" stroke="#7048e8" stroke-width="1.4"><title>Resolution: role → permission → token → gate</title></rect><rect x="50" y="320" width="1240" height="230" rx="14" fill="#e7ecff" fill-opacity="0.16" stroke="#4263eb" stroke-width="1.4"><title>Gated page routes (config.matcher)</title></rect><path d="M290,180 L370,180" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M625,180 L705,180" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M930,180 L1010,180" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M1094,250 C1094,308.68226648656304 961,301.31773351343696 961,360" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M1211.6,250 C1211.6,326.896665831491 1106,373.103334168509 1106,450" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mRed)"/><rect x="271.35" y="170.5" width="117.3" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="330" y="183.4" font-size="10" fill="#3a434f" text-anchor="middle">load roles + scope</text><rect x="618.05" y="170.5" width="93.89999999999999" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="665" y="183.4" font-size="10" fill="#3a434f" text-anchor="middle">embed in token</text><rect x="911.35" y="170.5" width="117.3" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="970" y="183.4" font-size="10" fill="#3a434f" text-anchor="middle">decode per request</text><rect x="963" y="295.5" width="129" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="1027.5" y="308.4" font-size="10" fill="#3a434f" text-anchor="middle">allow / 302 redirect</text><rect x="1094.3" y="340.5" width="129" height="18" rx="9" fill="#ffffff" stroke="#e03131" stroke-opacity="0.45"/><text x="1158.8" y="353.4" font-size="10" fill="#3a434f" text-anchor="middle">role gate (not perm)</text><g><rect x="50" y="67" width="308.4" height="26" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.2"/><text x="204.2" y="84.5" font-size="12" font-weight="700" fill="#4a2fb0" text-anchor="middle">Resolution: role → permission → token → gate</text></g><g><rect x="66" y="307" width="242.39999999999998" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="187.2" y="324.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">Gated page routes (config.matcher)</text></g><g><title>admin_users_roles — 7 role labels; + baseline (any user); + scope (type / org)</title><rect x="50" y="110" width="240" height="140" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="62" y="125" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="78" y="134" font-size="13.5" font-weight="700" fill="#8a5a00">admin_users_roles</text><text x="64" y="151" font-size="11" fill="#5b6470">7 role labels</text><text x="64" y="166" font-size="11" fill="#5b6470">+ baseline (any user)</text><text x="64" y=