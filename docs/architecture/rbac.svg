x="1024" y="181" font-size="11" fill="#5b6470">self-only redirects</text></g><g><title>/curate — canCurate</title><rect x="80" y="360" width="270" height="66" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="92" y="375" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="108" y="384" font-size="13.5" font-weight="700" fill="#2b3a8c">/curate</text><text x="94" y="401" font-size="11" fill="#5b6470">canCurate</text></g><g><title>/report — canReport</title><rect x="372" y="360" width="200" height="66" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="384" y="375" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="400" y="384" font-size="13.5" font-weight="700" fill="#2b3a8c">/report</text><text x="386" y="401" font-size="11" fill="#5b6470">canReport</text></g><g><title>/search — canSearch</title><rect x="594" y="360" width="200" height="66" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="606" y="375" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="622" y="384" font-size="13.5" font-weight="700" fill="#2b3a8c">/search</text><text x="608" y="401" font-size="11" fill="#5b6470">canSearch</text></g><g><title>/manageusers — canManageUsers</title><rect x="816" y="360" width="290" height="66" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="828" y="375" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="844" y="384" font-size="13.5" font-weight="700" fill="#2b3a8c">/manageusers</text><text x="830" y="401" font-size="11" fill="#5b6470">canManageUsers</text></g><g><title>/configuration — canConfigure</title><rect x="80" y="450" width="270" height="66" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="92" y="465" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="108" y="474" font-size="13.5" font-weight="700" fill="#2b3a8c">/configuration</text><text x="94" y="491" font-si